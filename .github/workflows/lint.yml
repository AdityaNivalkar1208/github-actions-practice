name: Auto Linter

on:
  push: 
    paths: "*.py"

jobs:
  code-linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout/Clone the code
        uses: actions/checkout@v7

      - name: Setup python
        uses: actions/setup-python@5
        with:
          python-version: '3.14'

      - name: Install Linter
        run: pip install ruff

      - name: Check the Code
        run: ruff check .
